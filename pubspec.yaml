name: hustl_app
description: "A Modern Mobile-First Strength Training Tracker"
# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0' # Keep in sync with Flutter SDK (camera requires Dart >=3.9)

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6 # For iOS icons
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  http: ^1.2.1
  fl_chart: ^1.2.0
  flutter_local_notifications: ^17.1.2

  # Motion / animation helpers (Wave A design foundation)
  flutter_animate: ^4.5.0
  # Android high-refresh-rate opt-in (wired in Wave B)
  flutter_displaymode: ^0.6.0
  # Native splash preserve/remove is called at runtime in main()/bootstrap.
  flutter_native_splash: ^2.4.0

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Dependency Injection
  get_it: ^7.7.0

  # Routing
  go_router: ^14.2.0

  # Value Equality
  equatable: ^2.0.5
  
  # URL Handling
  url_launcher: ^6.2.5
  url_strategy: ^0.3.0
  web: ^1.1.1
  app_links: ^6.3.2
  
  # Markdown Rendering
  flutter_markdown: ^0.6.20
  flutter_svg: ^2.0.9
  xml: ^6.5.0

  # UUID generation
  uuid: ^4.3.2
  
  # Social Auth (optional login)
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0 # Native Apple sign-in (iOS); App Store requirement
  path_provider: ^2.1.3
  
  # Local Storage
  sqflite: ^2.4.2 # Spec called for ^3.0.0; latest published is 2.4.x
  # Bundled, FTS5-capable sqlite3 for the on-device food index. The OS SQLite
  # (used by default sqflite) omits FTS5 on some Android OEM/older builds, so
  # LocalFoodIndex runs on the ffi factory backed by sqlite3_flutter_libs.
  sqlite3_flutter_libs: ^0.5.20
  sqflite_common_ffi: ^2.3.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  collection: ^1.18.0
  crypto: ^3.0.3
  csv: ^5.0.2
  file_picker: ^8.0.3
  share_plus: ^10.0.0
  timezone: ^0.9.2
  package_info_plus: ^8.0.0
  audioplayers: ^5.2.1

  # Date formatting
  intl: ^0.18.0
  table_calendar: ^3.0.9
  scrollable_positioned_list: ^0.3.8

  home_widget: ^0.8.0
  health: ^13.1.3
  mobile_scanner: ^7.1.3
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.2.1
  camera: ^0.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # Recommended lints
  bloc_test: ^9.1.7 # For testing BLoCs
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/hustl-icon.png"
  remove_alpha_ios: true
  # Android adaptive icon (quality bar on minSdk 26+). Background is the brand
  # blue; foreground is the white glyph pre-padded to the 66dp safe zone
  # (assets/icon/hustl-adaptive-foreground.png) so no OEM launcher mask clips it.
  adaptive_icon_background: "#3B82F6"
  adaptive_icon_foreground: "assets/icon/hustl-adaptive-foreground.png"
  web:
    generate: true
    image_path: "assets/icon/hustl-icon.png"
    background_color: "#ffffff"
    theme_color: "#000000"

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/brand_claude.svg
    - assets/icons/brand_chatgpt.svg
    - assets/icons/brand_codex.svg
    - assets/icons/food/
    - assets/icon/hustl-icon.png
    - assets/icon/hustl-glyph-ink.png
    - assets/icon/hustl-glyph-white.png
    - assets/data/exercises_seed.json
    - assets/data/foods_generic.json
    - assets/audio/

  # Bundled DM Sans (static weights, official Google Fonts instances).
  # Bundling kills the first-run CDN race and layout reflow; no runtime
  # font fetching anywhere.
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

# Native splash configuration. Wave B wires FlutterNativeSplash.preserve/remove
# in main(); this block is the generator config only.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/icon/hustl-glyph-ink.png
  image_dark: assets/icon/hustl-glyph-white.png
  android_12:
    color: "#F2F5FA"
    color_dark: "#0B0B0F"
    # Android 12+ masks windowSplashScreenAnimatedIcon into a circle and scales it
    # to fill a fixed ~240dp slot, so a full-bleed app icon renders oversized and
    # corner-clipped. Use dedicated high-res (1152px) padded glyphs — the dumbbell
    # at ~62% on a transparent canvas — so the mark stays crisp (not upscaled from
    # the 336px glyph) and inside the safe circle even if this is regenerated.
    image: assets/icon/hustl-splash-glyph-ink.png
    image_dark: assets/icon/hustl-splash-glyph-white.png
  android: true
  ios: true
  web: false
