name: hustl_app
description: Deterministic public Hustl WebMCP evaluator
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bloc: ^8.1.4
  camera: ^0.11.3
  collection: ^1.18.0
  crypto: ^3.0.3
  equatable: ^2.0.5
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.0
  flutter_bloc: ^8.1.6
  flutter_svg: ^2.0.9
  get_it: ^7.7.0
  go_router: ^14.2.0
  image_picker: ^1.2.1
  intl: ^0.18.0
  mobile_scanner: ^7.1.3
  shimmer: ^3.0.0
  url_launcher: ^6.2.5
  uuid: ^4.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/food/
    - assets/data/exercises_seed.json
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
