name: Public evaluator CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Install checksum-verified Flutter
        run: |
          bash scripts/install_flutter_ci.sh "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"

      - name: Install checksum-verified Gitleaks
        run: |
          bash scripts/install_gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"

      - name: Verify reviewed public source
        run: |
          bash scripts/scan_public_source.sh .
          bash test/public_release_test.sh
          bash scripts/verify_gitleaks.sh "$GITLEAKS_BIN" .

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub -r compact
          node --test test/webmcp/*.mjs

      - name: Build isolated evaluator
        run: bash scripts/build.sh

      - name: Verify release and create artifact manifest
        run: |
          bash scripts/verify.sh build/web
          bash scripts/verify_gitleaks.sh "$GITLEAKS_BIN" . build/web
          bash scripts/create_artifact_manifest.sh build/web artifacts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hustl-webmcp-evaluator-${{ github.sha }}
          path: |
            build/web
            artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hustl-webmcp-evaluator-${{ github.sha }}
          path: release

      - name: Attest main-branch build manifest provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/artifacts/build.sha256
