name: Public evaluator CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true

      - name: Reconstruct and verify frozen candidate
        run: bash .github/scripts/reconstruct-candidate.sh "$RUNNER_TEMP/frozen-candidate"

      - name: Analyze and test
        working-directory: ${{ runner.temp }}/frozen-candidate
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub test/core/webmcp test/app/demo test/app/navigation
          node --test test/webmcp/*.mjs

      - name: Build and re-verify release
        working-directory: ${{ runner.temp }}/frozen-candidate
        run: |
          bash scripts/build.sh
          bash scripts/verify.sh
          mkdir -p artifacts
          (cd build/web && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256) > artifacts/build.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hustl-webmcp-evaluator-${{ github.sha }}
          path: |
            ${{ runner.temp }}/frozen-candidate/build/web
            ${{ runner.temp }}/frozen-candidate/artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hustl-webmcp-evaluator-${{ github.sha }}
          path: release

      - name: Attest main-branch build manifest provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/artifacts/build.sha256
